name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Check prerequisites
        run: |
          command -v bash
          command -v python3
          command -v make
          node --version

      - name: Run all tests
        run: make test
